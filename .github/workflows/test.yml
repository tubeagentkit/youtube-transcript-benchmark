name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest youtube-transcript-api "yt-dlp[default]"
      - run: python -m pytest tests -q
      - name: No API key anywhere in the repository
        run: "! git grep -n -E 'sk_live_[A-Za-z0-9_-]{8,}'"
