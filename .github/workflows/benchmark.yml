name: Weekly benchmark

on:
  schedule:
    - cron: "3 6 * * 1"
  workflow_dispatch:
    inputs:
      methods:
        description: "Comma-separated methods to run"
        default: "ytapi,ytdlp,gyt"
      slug:
        description: "Results file slug (results/<date>-<slug>.jsonl)"
        default: "actions"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install youtube-transcript-api "yt-dlp[default]"
      - name: Run the benchmark
        env:
          GYT_API_KEY: ${{ secrets.GYT_API_KEY }}
        run: python harness/run.py --env "GitHub Actions runner (ubuntu-latest, hosted cloud IP)" --env-slug "${{ inputs.slug || 'actions' }}" --methods "${{ inputs.methods || 'ytapi,ytdlp,gyt' }}"
      - name: Summarise
        run: python harness/analyze.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly results $(date -u +%F)"
          git push
